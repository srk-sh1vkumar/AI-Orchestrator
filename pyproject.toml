[tool.poetry]
name = "ai-orchestrator"
version = "0.1.0"
description = "Intelligent LLM orchestrator with multi-provider routing and tool execution"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
anthropic = "^0.18.0"
openai = "^1.10.0"
google-generativeai = "^0.3.0"
httpx = "^0.26.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^1.0.0"
redis = "^5.0.1"
aioredis = "^2.0.1"
prometheus-client = "^0.19.0"
structlog = "^24.1.0"
tenacity = "^8.2.3"
circuitbreaker = "^2.0.0"
docker = "^7.0.0"
kubernetes = "^29.0.0"
pygithub = "^2.1.1"
elasticsearch = "^8.11.0"
boto3 = "^1.34.0"
prometheus-api-client = "^0.5.3"
requests = "^2.31.0"
pyyaml = "^6.0.1"
jinja2 = "^3.1.3"
rich = "^13.7.0"
aiofiles = "^23.2.1"
tiktoken = "^0.5.2"
sentence-transformers = "^2.2.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.1.0"
ruff = "^0.1.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "B", "C4"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
