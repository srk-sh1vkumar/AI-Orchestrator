phase_1_design_decisions:
  enhancement_004_semantic_caching:
    status: "Awaiting Decision"
    blocking_questions:
      - question: "Which embedding model should we use?"
        options:
          - name: "OpenAI ada-002"
            pros: "High quality, well-tested, 1536 dimensions"
            cons: "API cost, latency, external dependency"
          - name: "Sentence-Transformers (local)"
            pros: "Free, fast, privacy-friendly, no external calls"
            cons: "Requires GPU for best performance, may need fine-tuning"
          - name: "Gemini Embeddings"
            pros: "Free tier available, good quality"
            cons: "Another API dependency, quota limits"
        recommendation: "Start with Sentence-Transformers (all-MiniLM-L6-v2), migrate to OpenAI if quality issues"
        impact: "Affects cost, latency, and cache quality"

      - question: "What similarity threshold for cache hits?"
        options:
          - name: "0.95 (strict)"
            pros: "High precision, fewer false positives"
            cons: "Lower cache hit rate"
          - name: "0.85 (balanced)"
            pros: "Good balance of precision and recall"
            cons: "May cache slightly different queries"
          - name: "0.75 (permissive)"
            pros: "Higher cache hit rate"
            cons: "Risk of incorrect cache hits"
        recommendation: "Start with 0.85, make configurable per task category"
        impact: "Directly affects cache hit rate and cost savings"

      - question: "Cache storage: Redis or PostgreSQL?"
        options:
          - name: "Redis with RediSearch"
            pros: "Fast, native vector search, TTL support"
            cons: "Another service to manage, memory limits"
          - name: "PostgreSQL with pgvector"
            pros: "Single database, persistent, ACID guarantees"
            cons: "Slower than Redis, more complex queries"
          - name: "Hybrid: Redis (hot cache) + PostgreSQL (cold storage)"
            pros: "Best of both worlds"
            cons: "Complexity, cache coherence challenges"
        recommendation: "Redis for MVP (simpler), migrate to hybrid if needed"
        impact: "Affects performance, operational complexity, cost"

  enhancement_012_state_management:
