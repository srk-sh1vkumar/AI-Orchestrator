        - "Profile switching based on context"
        - "Blended response generation"
      performance_tests:
        - "Classification latency <80ms p95"
        - "Routing decision <150ms p95 total"
        - "Blending overhead <500ms"
      quality_tests:
        - "A/B testing: with vs without classification"
        - "User satisfaction surveys"
        - "Response relevance scoring"

    reflection_prompts:
      implementation:
        - "Did classify_query() correctly infer intent for ambiguous queries?"
        - "Are routing profiles switching automatically based on context?"
        - "Is multi-provider blending yielding better results than single-model?"
        - "Are vague queries now resolved with minimal follow-up?"
      quality:
        - "Compare generic response rate before/after implementation"
        - "Measure user clarification requests before/after"
        - "Evaluate blended response quality vs single-provider"
      performance:
        - "Is classification overhead acceptable (<80ms)?"
        - "Does routing remain fast with additional logic?"
        - "Are there performance bottlenecks in blending?"

    deliverables:
      config_files:
        - "config/routing_weights.yaml"
        - "config/routing_profiles/developer.yaml"
        - "config/routing_profiles/incident_analysis.yaml"
        - "config/routing_profiles/production.yaml"
      code_files:
        - "src/core/query_classifier.py (~300 lines)"
        - "src/core/response_blender.py (~200 lines)"
