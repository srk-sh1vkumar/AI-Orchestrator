  - id: "018"
    db_reference: "db-uuid-018-dynamic-context-routing"
    title: "Dynamic Context-Aware Routing and Intelligent Response Generation"
    category: "Routing & Intelligence"
    priority: "High"
    status: "Planned"
    impact: "Eliminate generic answers, improve routing accuracy by 40%, reduce user clarification requests by 60%"
    related_agent: "Task Router + Orchestrator Core"
    estimated_hours: 16  # 2-3 days
    actual_hours: null
    completion_percentage: 0
    dependencies:
      - yaml_id: "001"
        note: "Builds on Intent-Based Routing with ML (✅ COMPLETE)"
      - yaml_id: "017"
        note: "Integrates with routing_weights.yaml from Architecture Delta (in progress)"
    technical_summary: |
      Address the Orchestrator's limitation of providing static or generic responses to open-ended queries
      by introducing dynamic context-aware routing that interprets user intent semantically and selects
      optimal LLM(s) based on query context, not just keywords.

      **Problem Statement:**
      - Current routing defaults to single provider for ambiguous queries
      - Generic answers for high-level/system-level questions
      - No semantic understanding of query intent
      - No multi-provider blending for nuanced responses

      **Solution:**
      Implement pre-routing intent classification and context-aware provider selection with optional
      multi-provider blending for complex queries requiring multiple perspectives.

      **Key Components:**
      1. **classify_query() Pre-Routing Step** - Intent inference before routing decision
      2. **Routing Profiles System** - Semantic provider matching via config/routing_weights.yaml
      3. **Dynamic Provider Selection** - Context-aware routing based on detected intent
      4. **Multi-Provider Blending** (Optional) - Merge responses from multiple LLMs
      5. **Contextual System Prompts** - Intelligent interpretation of vague queries
      6. **Adaptive Context Profiles** - Developer, incident-analysis, production modes

    technical_breakdown:
      phases:
        phase_1:
          name: "Routing Profiles & Configuration"
          estimated_hours: 4
          tasks:
            - "Create config/routing_weights.yaml with semantic patterns"
            - "Add routing_profiles section (developer, incident-analysis, production)"
            - "Define intent_patterns for common query types"
            - "Create profile-specific provider weights"
          deliverables:
            - "config/routing_weights.yaml (new file)"
            - "config/routing_profiles/developer.yaml"
            - "config/routing_profiles/incident_analysis.yaml"
            - "config/routing_profiles/production.yaml"
          example_config: |
            routing_profiles:
              developer:
                default_providers: [claude_code, gemini, local]
                intents:
                  code_review: {primary: claude_code, secondary: local}
                  architecture_design: {primary: gemini, secondary: chatgpt}
                  debugging: {primary: claude_code, fallback: [local, gemini]}
              incident_analysis:
                default_providers: [local, gemini, chatgpt]
                intents:
                  log_analysis: {primary: local, privacy: true}
                  root_cause: {blend: [local, gemini], merge_strategy: sequential}
                  report_generation: {primary: chatgpt, context_from: [local, gemini]}

        phase_2:
          name: "classify_query() Implementation"
          estimated_hours: 6
          tasks:
            - "Implement classify_query() in src/core/orchestrator.py"
            - "Add query intent detection using ML embeddings"
            - "Extract context signals (keywords, entities, sentiment)"
            - "Determine query complexity score (1-10)"
            - "Detect multi-intent queries requiring blending"
          deliverables:
            - "src/core/query_classifier.py (new file, ~300 lines)"
            - "Enhanced TaskRouter with pre-classification"
          components:
            - "IntentClassifier: Detect query intent category"
            - "ContextExtractor: Extract entities, keywords, signals"
            - "ComplexityScorer: Rate query complexity (1-10)"
            - "BlendingDetector: Identify multi-perspective needs"
          success_criteria:
            - "Intent classification accuracy >90%"
            - "Classification latency <80ms p95"
            - "Correctly detect blend-worthy queries >85%"

        phase_3:
          name: "Dynamic Routing Logic Update"
          estimated_hours: 4
          tasks:
            - "Update orchestrator.py routing to use classify_query()"
            - "Integrate routing profiles with provider selection"
            - "Add profile switching based on context (dev vs prod)"
            - "Implement fallback chain per profile"
          deliverables:
            - "Enhanced Orchestrator.route() method"
            - "ProfileManager for context switching"
          success_criteria:
            - "Profile-aware routing working for all 3 profiles"
            - "Automatic profile detection from query context"
            - "Fallback chains respected per profile"

        phase_4:
          name: "Multi-Provider Blending (Optional)"
          estimated_hours: 2
          tasks:
            - "Implement response blending strategies"
            - "Add sequential blending (A → B with A's context)"
            - "Add parallel blending (A + B → merge)"
            - "Create merge strategies (consensus, best-of, combined)"
          deliverables:
            - "src/core/response_blender.py (new file, ~200 lines)"
          blend_strategies:
            - "sequential: Response from A passed to B as context"
            - "parallel: Both respond independently, merge results"
            - "consensus: Multiple providers vote on best answer"
            - "combined: Intelligent merge of complementary responses"
          success_criteria:
            - "Blended responses rated higher quality >70% of time"
            - "Sequential blending preserves context 100%"
            - "Parallel blending completes in <3s"

    routing_profiles:
      developer:
        description: "Optimized for development and code-related queries"
        default_providers: ["claude_code", "gemini", "local"]
        intent_mapping:
          code_generation: {primary: "claude_code", confidence_threshold: 0.8}
          code_review: {primary: "claude_code", secondary: "local"}
          architecture_design: {primary: "gemini", secondary: "chatgpt"}
          debugging: {blend: ["claude_code", "local"], strategy: "sequential"}
          documentation: {primary: "chatgpt", secondary: "gemini"}
        fallback_chain: ["claude_code", "gemini", "local", "chatgpt"]

      incident_analysis:
        description: "Privacy-first incident analysis and root cause"
        default_providers: ["local", "gemini", "chatgpt"]
        intent_mapping:
          log_analysis: {primary: "local", privacy: true, no_cache: true}
          metrics_analysis: {primary: "gemini", cache_ttl: 300}
          root_cause_analysis: {blend: ["local", "gemini"], strategy: "parallel"}
          incident_report: {primary: "chatgpt", context_from: ["local", "gemini"]}
          postmortem: {blend: ["local", "chatgpt"], strategy: "sequential"}
        fallback_chain: ["local", "gemini", "chatgpt", "claude"]
        privacy_mode: true

      production:
        description: "Production routing with reliability and cost optimization"
        default_providers: ["gemini", "local", "claude_code"]
        intent_mapping:
          general_query: {primary: "gemini", fallback: ["local", "claude"]}
          technical_query: {primary: "claude_code", fallback: ["gemini"]}
          creative_query: {primary: "chatgpt", fallback: ["claude"]}
        fallback_chain: ["gemini", "local", "claude_code", "chatgpt", "claude"]
        cost_optimization: true
        cache_aggressive: true

    contextual_system_prompts:
      description: "System prompts that enable intelligent interpretation of vague queries"
      base_prompt: |
        You are an intelligent LLM orchestrator assistant. When given vague or high-level queries,
        you should intelligently infer the user's intent based on context and provide relevant,
        specific answers rather than generic responses.

        Guidelines:
        - Analyze query semantics, not just keywords
        - Consider user's likely role (developer, SRE, product manager)
        - Provide actionable, specific answers
        - Ask clarifying questions only when truly ambiguous
        - Use context from conversation history

      profile_specific:
        developer: |
          Focus on technical implementation details, code examples, and best practices.
          Assume user wants practical, actionable development guidance.

        incident_analysis: |
          Prioritize privacy and security. Focus on root cause analysis, metrics,
          and actionable remediation steps. Provide structured incident reports.

        production: |
          Balance cost, performance, and reliability. Provide production-ready
          recommendations with monitoring and alerting considerations.

    success_criteria:
      - "Intent classification accuracy >90% on test dataset (500 queries)"
      - "Reduction in generic 'I need more context' responses by 60%"
      - "User clarification requests reduced by 60%"
      - "Multi-provider blending improves answer quality >70% of cases"
      - "Profile switching works automatically based on query context"
      - "Routing decision latency remains <150ms p95 (including classification)"
      - "No code edits required to add new routing patterns (config-driven)"

    testing_requirements:
