name: DevAI Orchestrator CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install Poetry
      run: |
        pip install poetry
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run Black (formatter check)
      run: poetry run black --check src api dashboard tests

    - name: Run Ruff (linter)
      run: poetry run ruff check src api dashboard tests

  type-checking:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run MyPy
      run: poetry run mypy src --ignore-missing-imports
      continue-on-error: true  # Type checking is strict, allow soft failure

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run pytest
      run: poetry run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  integration-tests:
    name: Integration Tests (API Endpoints)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Create test environment file
      run: |
        cat > .env << EOF
        ANTHROPIC_API_KEY=test_key
        OPENAI_API_KEY=test_key
        GOOGLE_API_KEY=test_key
        LOCAL_LLM_ENABLED=false
        EOF

    - name: Start API server in background
      run: |
        cd api
        poetry run python server.py &
        sleep 5
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Test /health endpoint
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
        if [ $response -eq 200 ]; then
          echo "✅ /health endpoint: OK"
        else
          echo "❌ /health endpoint failed with status: $response"
          exit 1
        fi

    - name: Test /status endpoint
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/status)
        if [ $response -eq 200 ]; then
          echo "✅ /status endpoint: OK"
        else
          echo "❌ /status endpoint failed with status: $response"
          exit 1
        fi

    - name: Test /metrics endpoint
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/metrics)
        if [ $response -eq 200 ]; then
          echo "✅ /metrics endpoint: OK"
        else
          echo "❌ /metrics endpoint failed with status: $response"
          exit 1
        fi

    - name: Test /growth endpoint
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/growth)
        if [ $response -eq 200 ]; then
          echo "✅ /growth endpoint: OK"
        else
          echo "❌ /growth endpoint failed with status: $response"
          exit 1
        fi

  simulation-run:
    name: Orchestrator Simulation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: pip install poetry

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run simulation harness
      run: poetry run python simulate_run.py
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Verify manifest generation
      run: |
        if [ -f manifest_state.json ]; then
          echo "✅ manifest_state.json generated successfully"
          cat manifest_state.json | head -20
        else
          echo "❌ manifest_state.json not found"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: orchestrator-artifacts
        path: |
          manifest_state.json
          orchestrator_summary.json
          logs/

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t devai-orchestrator:test .

    - name: Verify Docker image
      run: docker images devai-orchestrator:test

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r src api dashboard -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json
      if: always()

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests, integration-tests, docker-build]
    if: github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging (placeholder)
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "This would deploy to your staging infrastructure"
        # Add actual deployment commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests, integration-tests, docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production (placeholder)
      run: |
        echo "🚀 Deploying to production environment..."
        echo "This would deploy to your production infrastructure"
        # Add actual deployment commands here
